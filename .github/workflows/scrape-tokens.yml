name: Token Scraper - Every 6 Hours

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape-tokens:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run token scraper
        env:
          DEXSCREENER_API_KEY: ${{ secrets.DEXSCREENER_API_KEY }}
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
          MOONARCH_API_KEY: ${{ secrets.MOONARCH_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPO: ${{ secrets.GITHUB_REPO }}
          MAX_AGE_HOURS: 48
          MAX_HOLDERS: 1000
          MIN_LIQUIDITY_USD: 5000
          OUTPUT_FORMAT: both
          GITHUB_ENABLED: true
        run: node dist/scripts/scheduledScraper.js

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: token-scraper-output-${{ github.run_number }}
          path: output/
          retention-days: 30

      - name: Comment on workflow run
        if: failure()
        run: |
          echo "Token scraping failed. Check the logs for details."
          exit 1
